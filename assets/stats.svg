<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Hive Vision v2: 97.3% precision, 18 to 21 ms per inference, 25 detections per frame, 14,409 labeled images" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="190" fill="#000"/>
  <g>
    <rect x="20.0" y="20" width="275.0" height="150" rx="14" fill="#0c0c0f" stroke="#ffffff" stroke-opacity="0.22"/>
    <path d="M34.0 20 H281.0" stroke="url(#top)" stroke-width="2"/>
    <text x="157.5" y="92" text-anchor="middle" fill="#ffffff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800">97.3%</text>
    <text x="157.5" y="122" text-anchor="middle" fill="#d5d5dc" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="3">PRECISION</text>
    <text x="157.5" y="147" text-anchor="middle" fill="#8b8b96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">v2 retrain</text>
  </g>
  <g>
    <rect x="315.0" y="20" width="275.0" height="150" rx="14" fill="#0c0c0f" stroke="#ffffff" stroke-opacity="0.22"/>
    <path d="M329.0 20 H576.0" stroke="url(#top)" stroke-width="2"/>
    <text x="452.5" y="92" text-anchor="middle" fill="#ffffff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800">18–21 ms</text>
    <text x="452.5" y="122" text-anchor="middle" fill="#d5d5dc" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="3">PER INFERENCE</text>
    <text x="452.5" y="147" text-anchor="middle" fill="#8b8b96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">~6× faster than v1</text>
  </g>
  <g>
    <rect x="610.0" y="20" width="275.0" height="150" rx="14" fill="#0c0c0f" stroke="#ffffff" stroke-opacity="0.22"/>
    <path d="M624.0 20 H871.0" stroke="url(#top)" stroke-width="2"/>
    <text x="747.5" y="92" text-anchor="middle" fill="#ffffff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800">25</text>
    <text x="747.5" y="122" text-anchor="middle" fill="#d5d5dc" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="3">DETECTIONS / FRAME</text>
    <text x="747.5" y="147" text-anchor="middle" fill="#8b8b96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">up from 10</text>
  </g>
  <g>
    <rect x="905.0" y="20" width="275.0" height="150" rx="14" fill="#0c0c0f" stroke="#ffffff" stroke-opacity="0.22"/>
    <path d="M919.0 20 H1166.0" stroke="url(#top)" stroke-width="2"/>
    <text x="1042.5" y="92" text-anchor="middle" fill="#ffffff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800">14,409</text>
    <text x="1042.5" y="122" text-anchor="middle" fill="#d5d5dc" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="3">LABELED IMAGES</text>
    <text x="1042.5" y="147" text-anchor="middle" fill="#8b8b96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">synthetic + real + hard negatives</text>
  </g>
</svg>
